openapi: 3.1.0
info:
  title: Contrato de integración del Asistente (v1)
  version: "1"
  description: |
    Lo que cada sistema debe implementar para integrarse con el asistente.
    Las rutas son las sugeridas; en el registro del asistente son configurables.
servers:
  - url: https://sistema.example.com
paths:
  /asistente/token:
    get:
      summary: Emite un JWT corto para el usuario logueado (lectura, o escritura para una confirmación)
      description: |
        Usa la sesión normal del sistema. 403 si el usuario no tiene permitido el asistente.

        **Sin query** → token de lectura (`scope: asistente:lectura`, vida 5–15 min).

        **Con `confirmacion` y `huella`** (siempre juntas; si falta una, 400) → token de escritura
        (`scope: asistente:escritura`, `exp - iat` ≤ 60 s, `jti` único de un solo uso, claims `act` = tool de la propuesta,
        `ph` = huella, `cid` = confirmacion). Solo se emite si la huella corresponde a una propuesta que ESTE sistema
        produjo, que sigue vigente y que es del mismo usuario de la sesión; si no (o si el usuario no puede escribir), 403.
        Ver CONTRATO.md §8.3.
      parameters:
        - { name: confirmacion, in: query, required: false, schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,128}$" }, description: "Id de la confirmación que fija el asistente. Va en el claim `cid`." }
        - { name: huella, in: query, required: false, schema: { type: string, minLength: 8, maxLength: 128 }, description: "Huella devuelta por la propuesta. Va en el claim `ph`." }
      responses:
        "200":
          description: Token emitido
          content:
            application/json:
              schema: { $ref: "schemas/token-respuesta.schema.json" }
        "400":
          description: Solo vino uno de `confirmacion` / `huella`, o tienen formato inválido
        "401":
          description: Sin sesión en el sistema
        "403":
          description: El usuario no tiene permitido el asistente; o, con `confirmacion`/`huella`, no hay propuesta vigente suya con esa huella, o no puede escribir
  /asistente/tools:
    get:
      summary: Manifiesto de tools
      security: [{ tokenManifiesto: [] }]
      responses:
        "200":
          description: Manifiesto
          content:
            application/json:
              schema: { $ref: "schemas/manifiesto.schema.json" }
        "401":
          description: Credencial de manifiesto inválida
  /asistente/tools/{nombre}:
    post:
      summary: Ejecuta una tool con el token del usuario
      security: [{ tokenUsuario: [] }]
      parameters:
        - { name: nombre, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" } }
        - { name: X-Asistente-Contrato, in: header, required: true, schema: { type: string, const: "1" } }
        - { name: X-Asistente-Request-Id, in: header, required: false, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string }, description: "Obligatoria en escrituras (sección 8): un reintento con la misma clave devuelve el resultado anterior sin reejecutar." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/ejecucion-request.schema.json" }
      responses:
        "200":
          description: "Éxito (`ok: true`) o error de negocio (`ok: false`)"
          content:
            application/json:
              schema: { $ref: "schemas/ejecucion-respuesta.schema.json" }
        "401":
          description: Token inválido o vencido
        "403":
          description: |
            Scope insuficiente, o se usó el token de manifiesto. En escrituras (CONTRATO.md §8.4) también:
            token de lectura en una escritura, token de escritura en una lectura, `act` distinto de la tool pedida,
            `jti` ya usado, parámetros distintos a los de la propuesta cuya huella es `ph`, o falta `cid`.
        "5XX":
          description: Error del sistema
  /asistente/tools/{nombre}/propuesta:
    post:
      summary: "Valida y resume una acción de escritura, sin efectos (sección 8)"
      description: |
        Token de LECTURA (un token de escritura aquí es 403). NO debe escribir nada. Valida parámetros y permisos,
        redacta el resumen, calcula la huella y la recuerda (con el usuario y la tool) hasta `expira_s`.
      security: [{ tokenUsuario: [] }]
      parameters:
        - { name: nombre, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" } }
        - { name: X-Asistente-Contrato, in: header, required: true, schema: { type: string, const: "1" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/ejecucion-request.schema.json" }
      responses:
        "200":
          description: "Propuesta (`ok: true`) o error de negocio (`ok: false`)"
          content:
            application/json:
              schema: { $ref: "schemas/propuesta-respuesta.schema.json" }
        "401":
          description: Token inválido o vencido
        "403":
          description: Scope insuficiente
  /asistente/canal/codigo:
    post:
      summary: Canal WhatsApp (opcional). Código de vinculación de un solo uso para el usuario logueado
      description: Sesión normal del usuario. 403 si no puede usar el asistente. Ver CANAL_WHATSAPP.md §3.1.
      responses:
        "200":
          description: Código generado (vida 10 min)
          content:
            application/json:
              schema:
                type: object
                required: [codigo, expira]
                properties:
                  codigo: { type: string, example: "FST-7K2M9QXD" }
                  expira: { type: string, format: date-time }
        "403":
          description: El usuario no puede usar el asistente
  /asistente/canal/vincular:
    post:
      summary: Canal WhatsApp (opcional). Vincula un número a un usuario con su código
      description: Lo llama el asistente con la cabecera `Authorization` (Bearer <token_canal>). Ver CANAL_WHATSAPP.md §3.2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canal, wa_id, codigo]
              properties:
                canal: { type: string, enum: [whatsapp] }
                wa_id: { type: string, pattern: "^[0-9]{8,15}$" }
                codigo: { type: string }
      responses:
        "200":
          description: Vinculado
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean }, nombre: { type: string } }
        "400": { description: wa_id o cuerpo mal formado }
        "403": { description: Token de canal ausente o inválido }
        "404": { description: Código inexistente, vencido, usado o de usuario inactivo (sin distinguir) }
        "429": { description: Demasiados intentos }
  /asistente/canal/token:
    post:
      summary: Canal WhatsApp (opcional). Token por mensaje para el usuario vinculado a un número
      description: |
        Lo llama el asistente con la cabecera `Authorization` (Bearer <token_canal>). Sin `confirmacion` ni `huella` → token de
        lectura; con ambas → token de escritura (CANAL_WHATSAPP.md §4.1). Los claims llevan `canal: "whatsapp"`.
        Un `404` significa «sin vínculo activo» y el asistente lo toma como definitivo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canal, wa_id]
              properties:
                canal: { type: string, enum: [whatsapp] }
                wa_id: { type: string }
                confirmacion: { type: string, pattern: "^[A-Za-z0-9._-]{1,128}$" }
                huella: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Token emitido
          content:
            application/json:
              schema: { $ref: "schemas/token-respuesta.schema.json" }
        "400": { description: Cuerpo mal formado }
        "403": { description: Token de canal inválido, o escritura para una tool destructiva }
        "404": { description: Sin vínculo activo, caducado, revocado o usuario inactivo }
        "429": { description: Demasiadas emisiones }
  /asistente/salud:
    get:
      summary: Salud (opcional)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean } }
  /sistemas/{sistema_id}/avisos:
    servers:
      - url: https://asistente.example.com
        description: Lo implementa el ASISTENTE; el sistema es el cliente (AVISOS.md)
    post:
      summary: Avisos (opcional). El sistema pide un aviso saliente por WhatsApp a un usuario vinculado
      description: |
        Cabecera `Authorization` (Bearer <token_avisos>), distinta del token de canal. Idempotente por `id_evento`:
        el mismo contenido da `200` con el estado guardado, otro contenido `409`. `202` solo tras persistir. La
        aceptación no implica entrega. `texto` es una plantilla del sistema: no se interpreta ni llega al modelo.
        Ver AVISOS.md.
      parameters:
        - { name: sistema_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id_evento, tipo, destinatario, texto, contexto]
              properties:
                id_evento: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
                tipo: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$", example: refacturacion_pendiente }
                destinatario:
                  type: object
                  additionalProperties: false
                  required: [usuario_ref, wa_id]
                  properties:
                    usuario_ref: { type: string, minLength: 1, maxLength: 256 }
                    wa_id: { type: string, pattern: "^[0-9]{8,15}$" }
                texto: { type: string, minLength: 1, maxLength: 4000, description: Máximo efectivo = `avisos.max_texto` del sistema }
                contexto:
                  type: object
                  additionalProperties: false
                  required: [ref]
                  properties:
                    ref: { type: string, pattern: "^[A-Za-z0-9._:-]{1,40}$" }
                    comprobante_id: { type: [integer, string, "null"] }
                adjunto: { type: "null", description: Reservado; cualquier otro valor da 422 }
      responses:
        "202": { description: Aviso nuevo persistido, content: { application/json: { schema: { $ref: "#/components/schemas/Aviso" } } } }
        "200": { description: Repetido con el mismo contenido (estado guardado), content: { application/json: { schema: { $ref: "#/components/schemas/Aviso" } } } }
        "403": { description: Credencial inválida, sistema desconocido, deshabilitado o sin avisos (indistinguibles) }
        "409": { description: "`id_evento` repetido con contenido distinto" }
        "413": { description: Cuerpo mayor de 16 KB }
        "422": { description: Cuerpo inválido, tipo no permitido, texto demasiado largo, adjunto no nulo o destinatario sin vínculo vigente de ese usuario }
        "429": { description: Demasiados avisos pendientes para ese número (`Retry-After`) }
  /sistemas/{sistema_id}/avisos/{id_evento}:
    servers:
      - url: https://asistente.example.com
    get:
      summary: Avisos (opcional). Estado de un aviso
      parameters:
        - { name: sistema_id, in: path, required: true, schema: { type: string } }
        - { name: id_evento, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Estado, content: { application/json: { schema: { $ref: "#/components/schemas/Aviso" } } } }
        "403": { description: Credencial inválida o sistema sin avisos }
        "404": { description: Aviso inexistente }
components:
  schemas:
    Aviso:
      type: object
      required: [id_evento, tipo, estado, intentos]
      properties:
        id_evento: { type: string }
        tipo: { type: string }
        estado: { type: string, enum: [pendiente, enviando, enviado, fallido, incierto] }
        intentos: { type: integer }
        error: { type: [string, "null"] }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }
        enviado_en: { type: [string, "null"], format: date-time }
  securitySchemes:
    tokenUsuario:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de usuario (claims en schemas/token-claims.schema.json)
    tokenManifiesto:
      type: http
      scheme: bearer
      description: Credencial de servicio, solo válida para leer el manifiesto
    tokenAvisos:
      type: http
      scheme: bearer
      description: Credencial de servicio del sistema hacia el asistente, solo para /sistemas/{id}/avisos (distinta del token de canal)
