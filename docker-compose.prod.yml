# PRODUCCIÓN. Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Requiere un proxy inverso con TLS delante (nginx/Caddy/Traefik) que haga proxy a asistente:8000
# con buffering desactivado para SSE. Postgres no se publica fuera de la red interna.
services:
  asistente:
    build:
      context: .
      target: prod
    image: asistente:${ASISTENTE_VERSION:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      ASISTENTE_DATABASE_URL: postgresql+asyncpg://asistente:${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}@postgres:5432/asistente
      ASISTENTE_SISTEMAS_PATH: /config/sistemas.yaml
      ASISTENTE_LOG_LEVEL: INFO
    volumes:
      - ./config/sistemas.yaml:/config/sistemas.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks: [interna, publica]
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: asistente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}
      POSTGRES_DB: asistente
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistente"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  interna:
    internal: true      # postgres sin salida a internet
  publica: {}           # el proxy inverso se conecta aquí; asistente necesita egress al LLM y a los sistemas

volumes:
  pgdata:
