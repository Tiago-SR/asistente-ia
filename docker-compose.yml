# BASE de producción (genérica). Uso:
#   docker compose up -d --build        (lee ./.env; Dockge hace lo mismo). Uso real: deploy/deploy.sh
# Convención: un único .env por host (dev y prod son máquinas distintas); no se versiona.
# Desarrollo: docker compose -f docker-compose.dev.yml up --build
# Requiere un proxy inverso con TLS delante: docker-compose.prod.yml (VPS genérica, puerto en loopback) o docker-compose.proxy-externo.yml (proxy en red `web`).
# Debe hacer proxy a asistente:8000
# con buffering desactivado para SSE. Postgres no se publica fuera de la red interna.
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  asistente:
    build:
      context: .
      target: prod
    image: asistente:${ASISTENTE_VERSION:-latest}
    restart: unless-stopped
    logging: *logs
    env_file: .env
    environment:
      ASISTENTE_DATABASE_URL: postgresql+asyncpg://asistente:${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}@postgres:5432/asistente
      ASISTENTE_SISTEMAS_PATH: /config/sistemas.yaml
      ASISTENTE_LOG_LEVEL: INFO
    volumes:
      - ./config/sistemas.yaml:/config/sistemas.yaml:ro
      - ./config/precios.yaml:/config/precios.yaml:ro
      - ./config/voces.yaml:/config/voces.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks: [interna, publica]
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_USER: asistente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}
      POSTGRES_DB: asistente
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistente"]
      interval: 10s
      timeout: 3s
      retries: 10

  # STT local (dictado, perfil `voz`). El asistente lo usa con STT_BASE_URL=http://whisper:8000/v1
  # y STT_MODELO igual a WHISPER_MODELO. Sin puertos publicados. Necesita egress (red `publica`)
  # para descargar el modelo; la primera vez, si no lo bajó solo:
  #   docker compose exec whisper curl -X POST localhost:8000/v1/models/<STT_MODELO>
  whisper:
    profiles: ["voz"]   # opt-in: COMPOSE_PROFILES=voz en .env (o --profile voz). Sin STT no consume 2 GB
    logging: *logs
    image: ${WHISPER_IMAGEN:-ghcr.io/speaches-ai/speaches:latest-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8}
    restart: unless-stopped
    environment:
      PRELOAD_MODELS: '["${WHISPER_MODELO:-Systran/faster-whisper-small}"]'
      WHISPER__INFERENCE_DEVICE: ${WHISPER_DEVICE:-auto}
      STT_MODEL_TTL: ${WHISPER_TTL_S:-300}   # -1 = mantener cargado
      LOG_LEVEL: info
    volumes:
      - whisper-cache:/home/ubuntu/.cache/huggingface/hub
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
    networks: [interna, publica]

  # Búsqueda web gratuita (perfil `busqueda`): respaldo de Tavily cuando se le agota el cupo. El asistente lo usa con
  # WEB_SEARXNG_URL=http://searxng:8080. Sin puertos publicados; necesita egress (red `publica`) para consultar a los
  # buscadores, que pueden bloquear la IP del servidor: por eso es el respaldo y no el principal.
  searxng:
    profiles: ["busqueda"]   # opt-in: COMPOSE_PROFILES=busqueda en .env (o --profile busqueda)
    logging: *logs
    image: ${SEARXNG_IMAGEN:-searxng/searxng:2026.9.25-12f8b6515}
    restart: unless-stopped
    environment:
      # obligatorio (openssl rand -hex 32): sin él SearXNG no arranca. No se exige con `:?` para no romper el compose
      # en los hosts que no usan el perfil.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [interna, publica]

networks:
  interna:
    internal: true      # postgres sin salida a internet
  publica: {}           # el proxy inverso se conecta aquí; asistente necesita egress al LLM y a los sistemas

volumes:
  pgdata:
  whisper-cache:
