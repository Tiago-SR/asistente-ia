# USD por millón de tokens, por modelo (clave = modelo con el que responde el asistente).
# La usan `GET /admin/uso` (costo por sistema y mes) y los evals.
# `valle`/`pico`: la tarifa depende del horario del proveedor; los informes muestran las dos.
# Un modelo local o sin tarifa conocida: omitirlo (el informe da solo tokens).
# Verificar contra la lista de precios vigente del proveedor antes de usar las cifras para facturar.
deepseek-flash:
  entrada_cache_hit: {valle: 0.003, pico: 0.006}
  entrada_cache_miss: {valle: 0.15, pico: 0.3}
  salida: {valle: 0.6, pico: 1.2}
  nota: "Admite modo thinking (activo por defecto) y no-thinking. Línea base con el modo por defecto."

# Voz del servidor (TTS): clave `proveedor:modelo`, USD por 1000 caracteres de precio de lista (promociones aparte).
# Es un estimado: ElevenLabs cobra por plan de créditos mensuales. Ver PROVEEDORES_VOZ.md (datos del 2026-10-04).
"elevenlabs:eleven_flash_v2_5": {usd_por_1k_caracteres: 0.04}
"elevenlabs:eleven_turbo_v2_5": {usd_por_1k_caracteres: 0.04}
# v4 Turbo: precio de lista 0.04; con la promoción vigente hasta el 2026-10-12 cuesta 0.011 (el informe la sobrestima hasta entonces).
"elevenlabs:eleven_v4_turbo": {usd_por_1k_caracteres: 0.04}
"elevenlabs:eleven_multilingual_v2": {usd_por_1k_caracteres: 0.08}
"elevenlabs:eleven_v3": {usd_por_1k_caracteres: 0.08}
