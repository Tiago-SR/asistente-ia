# Copiar a config/sistemas.yaml (fuera de git). Ver sección 6 del contrato.
# Los secretos NUNCA van aquí: solo el nombre de la variable de entorno (en .env).
sistemas:
  # Referencia PHP (ejemplos/sistema-php), servicio `sistema-php` de docker-compose.dev.yml.
  # .env del asistente: PHP_SECRETO=secreto-php-0123456789-0123456789-ab  PHP_MANIFEST_TOKEN=manifiesto-php
  - id: sistema-php                       # = claim `iss`
    nombre: "Sistema PHP"
    base_url: http://sistema-php:8000     # servidor a servidor, red de compose
    origenes_permitidos:
      - http://localhost:8203             # origen de la página con el widget
    auth:
      algoritmo: HS256
      secreto_env: PHP_SECRETO
      audiencia: asistente                # = claim `aud`
      # Variante RS256 (recomendada fuera de pruebas):
      #   algoritmo: RS256
      #   clave_publica_env: PHP_PUBKEY   # PEM de la clave pública; sin `secreto_env`
    conector:
      token_manifiesto_env: PHP_MANIFEST_TOKEN
    # Opcional: idioma de los usuarios cuyo token no trae el claim `locale` (el claim, si viene, manda).
    # locale_defecto: es-UY
    # Fase 5 (opcional): escrituras que el modelo puede PROPONER; el usuario confirma cada una en pantalla.
    # Vacío (por defecto) = solo lectura. La tool debe declarar `confirmacion` en su manifiesto (contrato, sección 8).
    # acciones_habilitadas: [agregar_nota, modificar_nota]
    # Zona horaria (IANA) de los usuarios cuyo navegador no la informa; el widget envía la suya y esa manda.
    # Define qué día es «hoy» para el asistente. Sin ella ni la del navegador se usa UTC.
    # zona_horaria: America/Montevideo
    # «Lo mismo que ayer» (tool local `consultas_recientes`): el asistente puede listar las consultas que el usuario ya hizo
    # (tool y parámetros, nunca resultados) y volver a ejecutarlas con datos actuales. Activa por defecto; `false` la apaga
    # para este sistema. Solo ve los últimos `retencion_dias` días.
    # consultas_recientes: true
    # Memoria por usuario (apagada por defecto): el asistente puede guardar, SOLO a pedido del usuario y con su botón de
    # confirmación, preferencias (decimales, brevedad, entidad principal), alias («la sojera») y consultas guardadas
    # («la de siempre»), por usuario y por sistema. Vencen al mes sin usarse (ASISTENTE_MEMORIA_DIAS_SIN_USO) y el
    # usuario los ve y borra desde el widget. Los nombres `recordar` y `olvidar` quedan reservados en el manifiesto.
    # memoria_habilitada: true
    # LLM de este sistema (opcional; todo lo que se omita se hereda de LLM_* y ASISTENTE_MODELO_DEFAULT).
    # `imagenes: true` deja adjuntar imágenes de referencia SOLO si el modelo las admite (contrato, 7.7); sin esto manda
    # LLM_IMAGENES. Para cambiar de modelo o de endpoint: proveedor, modelo, base_url_env y api_key_env (nombres de variables).
    # llm:
    #   imagenes: true
    # Nombre del asistente en el widget (título, avisos, ajustes), hasta 40 caracteres. Es el valor por defecto: cada usuario
    # puede cambiarlo en su panel de ajustes (se guarda en su navegador). Sin esto el widget dice «Asistente».
    # nombre_asistente: Sofía
