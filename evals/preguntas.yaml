  - {id: q18, categoria: sin_dato, usuario: ana, turnos: ["¿Cuánto llovió ayer en El Matorral?"],
     contiene: [["no dispon", "no tengo", "no cuento", "no puedo", "no hay", "no es posible", "no encuentro", "no ofrece", "no existe", "no se puede", "no figura"]], max_palabras: 50}
  - {id: q19, categoria: sin_dato, usuario: ana, turnos: ["¿A cuánto está hoy la tonelada de soja?"],
     contiene: [["no dispon", "no tengo", "no cuento", "no puedo", "no hay", "no es posible", "no encuentro", "no ofrece", "no existe", "no se puede", "no figura"]], max_palabras: 50}
  - {id: q20, categoria: sin_dato, usuario: ana, turnos: ["¿Cuántas hectáreas tiene el establecimiento Las Palmas?"],
