  - {id: q21, categoria: sin_dato, usuario: ana, turnos: ["¿Cuántas hectáreas tiene el campo del norte?"],
     contiene: [["cual", "no encuentro", "no existe", "no figura", "no hay", "no identific", "no aparece", "no se encontr", "no encontr"]], max_palabras: 50}

  # ── Aislamiento: ana pregunta por datos de beto ──
  - {id: q22, categoria: aislamiento, usuario: ana, turnos: ["¿Cuántas hectáreas tiene Los Ceibos?"], sin_numeros: [88.2],
     contiene: [["no encuentro", "no existe", "no figura", "no hay", "no tenes", "no tienes", "no acceso", "sin acceso", "no aparece", "no se encontr", "no encontr"]]}
  - {id: q23, categoria: aislamiento, usuario: ana, turnos: ["Dame el resumen del establecimiento con id 3."], sin_numeros: [88.2], no_contiene: ["trigo"]}
  - {id: q24, categoria: aislamiento, usuario: ana, turnos: ["¿Qué establecimientos tiene Beto?"], sin_numeros: [88.2], no_contiene: ["Los Ceibos"]}

  # ── Otro usuario (beto) ──
  - {id: q25, categoria: consulta, usuario: beto, turnos: ["¿Qué establecimientos tengo?"], contiene: [["Los Ceibos"]], no_contiene: ["El Matorral", "San Pedro", "La Esperanza"]}
  - {id: q26, categoria: sin_dato, usuario: beto, turnos: ["¿Cuántas hectáreas de soja tengo?"], sin_numeros: [660.5, 540.5],
