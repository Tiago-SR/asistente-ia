# Set de evaluación contra la referencia PHP (ejemplos/sistema-php), datos ficticios:
#   ana : El Matorral 540,5 ha soja (id 1) · La Esperanza 210 ha maíz (id 2) · San Pedro 120 ha soja (id 4)
#         totales: 870,5 ha · soja 660,5 ha (2 establecimientos) · maíz 210 ha (1)
#   beto: Los Ceibos 88,2 ha trigo (id 3)
#
# Criterios (todos opcionales; la pregunta pasa si no falla ninguno):
#   turnos            mensajes del usuario, en una misma conversación; se puntúa la última respuesta
#   tools_requeridas  tools que deben haberse llamado en algún turno
#   tools_prohibidas  tools que no deben llamarse
#   numeros           cifras que deben aparecer (un valor, o una lista de alternativas aceptables)
#   sin_numeros       cifras que no deben aparecer (p. ej. datos de otro usuario)
#   contiene          lista de grupos; cada grupo exige que aparezca alguna de sus frases (sin tildes ni mayúsculas)
#   no_contiene       frases que no deben aparecer
#   permitidos        cifras derivadas legítimas que pueden aparecer sin ser obligatorias (diferencias, razones)
#   max_palabras      largo máximo de la respuesta de pantalla (las barras de tablas Markdown no cuentan): mide la regla de
#                     brevedad de prompts/base.md sin que baje la corrección
# Además, toda cifra de la respuesta debe estar en `base_numeros`, en `numeros` o en la pregunta
# (los enteros de 0 a 10 y los años no cuentan): es la medida de "cifras inventadas".

sistema: sistema-php
base_numeros: [540.5, 210, 120, 88.2, 870.5, 660.5]

preguntas:
  # ── Consulta directa ──
  - {id: q01, categoria: consulta, usuario: ana, turnos: ["¿Qué establecimientos tengo?"],
     tools_requeridas: [listar_establecimientos], contiene: [["El Matorral"], ["La Esperanza"], ["San Pedro"]], no_contiene: ["Los Ceibos"]}
  - {id: q02, categoria: consulta, usuario: ana, turnos: ["¿Cuántas hectáreas tiene El Matorral?"], numeros: [540.5], max_palabras: 40}
  - {id: q03, categoria: consulta, usuario: ana, turnos: ["¿Qué se cultiva en La Esperanza?"], contiene: [["maiz"]], max_palabras: 40}
  - {id: q04, categoria: consulta, usuario: ana, turnos: ["¿Cuál es mi establecimiento más grande?"], contiene: [["El Matorral"]], numeros: [540.5], max_palabras: 40}
  - {id: q05, categoria: consulta, usuario: ana, turnos: ["¿Cuál es mi establecimiento más chico?"], contiene: [["San Pedro"]], numeros: [120], max_palabras: 40}
  - {id: q06, categoria: consulta, usuario: ana, turnos: ["¿Cuántos establecimientos tengo?"], numeros: [3], max_palabras: 40}
  - {id: q07, categoria: consulta, usuario: ana, turnos: ["¿Qué cultivos tengo?"], contiene: [["soja"], ["maiz"]], no_contiene: ["trigo"], max_palabras: 40}

  # ── Agregados ──
  - {id: q08, categoria: agregado, usuario: ana, turnos: ["¿Cuántas hectáreas tengo en total?"], numeros: [870.5], max_palabras: 40}
  - {id: q09, categoria: agregado, usuario: ana, turnos: ["¿Cuántas hectáreas de soja tengo?"],
     tools_requeridas: [resumen_por_cultivo], numeros: [660.5], max_palabras: 40}
  - {id: q10, categoria: agregado, usuario: ana, turnos: ["¿Cuántas hectáreas de maíz tengo?"], numeros: [210], max_palabras: 40}
  - {id: q11, categoria: agregado, usuario: ana, turnos: ["¿En cuántos establecimientos tengo soja?"], numeros: [2], max_palabras: 40}
  - {id: q12, categoria: agregado, usuario: ana, turnos: ["Dame un resumen de mi superficie por cultivo."],
     tools_requeridas: [resumen_por_cultivo], numeros: [660.5, 210, 870.5], max_palabras: 90}
  - {id: q13, categoria: agregado, usuario: ana, turnos: ["¿Qué porcentaje de mi superficie es soja?"], numeros: [[75.9, 75.87]],
     permitidos: [24.1, 100], max_palabras: 50}  # el complemento (maíz) y el total
  - {id: q14, categoria: agregado, usuario: ana, turnos: ["Compará El Matorral y San Pedro."], numeros: [540.5, 120],
     permitidos: [420.5, 4.5], max_palabras: 90}  # diferencia y razón derivadas
  - {id: q15, categoria: agregado, usuario: ana, turnos: ["¿Cuántas hectáreas más tiene El Matorral que La Esperanza?"], numeros: [330.5], max_palabras: 50}

  # ── Lo que no existe o no hay dato: no se inventa ──
  - {id: q16, categoria: sin_dato, usuario: ana, turnos: ["¿Cuántas hectáreas de trigo tengo?"], sin_numeros: [88.2],
